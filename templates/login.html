{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<style>
    
body {
    background-color: #fff;
    color: #333;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
}


#intro {
    height: 100vh;
    background-color: #2ec4b6;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    animation: zoomIn 3s ease forwards;
    opacity: 0;
    transform: scale(0.5);
    padding: 20px;
}

@keyframes zoomIn {
    0% {
        opacity: 0;
        transform: scale(0.5);
    }
    50% {
        opacity: 1;
        transform: scale(1.05);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}


.loader {
    display: flex;
    gap: 12px;
    margin-top: 30px;
}

.loader div {
    width: 14px;
    height: 14px;
    background-color: #fff;
    border-radius: 50%;
    animation: pulse 1.2s infinite ease-in-out;
}

.loader div:nth-child(1) {
    animation-delay: 0.1s;
}
.loader div:nth-child(2) {
    animation-delay: 0.3s;
}
.loader div:nth-child(3) {
    animation-delay: 0.5s;
}

@keyframes pulse {
    0%, 80%, 100% {
        opacity: 0.3;
        transform: scale(0.8);
    }
    40% {
        opacity: 1;
        transform: scale(1.2);
    }
}


#login-form {
    max-width: 400px;
    margin: 60px auto;
    padding: 30px;
    background-color: #f0f0f0;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(66, 224, 236, 0.4);
    display: none;
    opacity: 0;
    transition: opacity 0.6s ease;
}

#login-form.show {
    opacity: 1;
}

.form-group {
    margin-bottom: 20px;
}

label {
    font-weight: 600;
    display: block;
    margin-bottom: 8px;
}

input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #2ec4b6;
    border-radius: 4px;
    font-size: 1rem;
    box-sizing: border-box;
}

input:focus {
    border-color: #12685f;
    outline: none;
    box-shadow: 0 0 6px #2ec4b6;
}


.btn {
    width: 100%;
    padding: 12px 20px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: back 0.3s ease;
}


.btn.primary {
    background-color: #2ec4b6;
    color: #fff;
}

.btn.primary:hover {
    background-color: #2ec4b6;
}


.register-link {
    margin-top: 15px;
    text-align: center;
}

.register-link a {
    color: #2ec4b6;
    text-decoration: none;
    font-weight: bold;
}

.register-link a:hover {
    text-decoration: underline;
}
.hen{
    text-align: center;
    color: #2ec4b6;
}

</style>

<div id="intro">
    <h1>RentMan</h1>
    <h2>Welcome Back!</h2>
    <p>Secure login portal – please authenticate to continue.</p>
    <div class="loader">
        <div></div>
        <div></div>
        <div></div>
    </div>
</div>


<div id="login-form">
    <h1 class="hen">RentMan</h1>
    <h2>Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />
        </div>

        <button type="submit" class="btn primary">Login</button>
    </form>

    <p class="register-link">
        Don't have an account? <a href="{{ url_for('register') }}">Register here</a>.
    </p>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
    const intro = document.getElementById("intro");
    const loginForm = document.getElementById("login-form");

    setTimeout(() => {
        
        intro.style.transition = "opacity 0.5s ease";
        intro.style.opacity = "0";

        setTimeout(() => {
            intro.style.display = "none";
            loginForm.style.display = "block";
            setTimeout(() => loginForm.classList.add("show"), 10);
        }, 500);
    }, 3000); 
});

</script>
{% endblock %}
